name: Build Android APK

# Trigger the build when you push to these branches
on:
  push:
    branches: [ development, main ]
  # Also allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    # Run on Ubuntu 22.04 (more compatible with buildozer than 24.04)
    runs-on: ubuntu-22.04

    steps:
    # Step 1: Download your code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python 3.9
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # Step 3: Install system dependencies needed for building
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk wget \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev

    # Step 4: Install Python build tools
    - name: Install buildozer and cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    # Step 5: Cache buildozer downloads (speeds up future builds)
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Cache Buildozer directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}

    # Step 6: Accept Android SDK licenses (create license files)
    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$HOME/.android/sdk/licenses"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.android/sdk/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$HOME/.android/sdk/licenses/android-sdk-license"

    # Step 7: Build the APK!
    - name: Build with Buildozer
      run: |
        # Start build - it will create its own SDK
        buildozer android debug || {
          # If it fails, copy licenses to buildozer's SDK location
          if [ -d "$HOME/.buildozer/android/platform/android-sdk" ]; then
            mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
            echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
            echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          fi
          # Retry build
          buildozer android debug
        }
      env:
        # Set buildozer cache directory
        BUILDOZER_CACHE: .buildozer_global

    # Step 8: Upload the APK so you can download it
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: veteran-grave-marker-apk
        path: bin/*.apk
        retention-days: 30

    # Step 9: Show build summary
    - name: Build Summary
      run: |
        echo "Build completed successfully!"
        echo "APK location: bin/"
        ls -lh bin/*.apk
